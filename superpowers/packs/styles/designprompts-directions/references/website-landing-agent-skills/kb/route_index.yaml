# Added in v1.1: technology-specific implementation routes.
tech_implementation_routes:
  gsap_landing_motion:
    aliases: ["GSAP", "GreenSock", "ScrollTrigger", "SplitText", "timeline", "pin", "scrub", "滚动驱动", "吸顶动效"]
    local_skill: "skills/08-gsap-landing-motion/SKILL.md"
    upstream_reference: "vendor/official/greensock-gsap-skills/README.md"
    notes: "Use for complex timelines, pinned/scrubbed scroll scenes, text/SVG/plugin animations. Avoid for simple CSS/motion-react transitions."
  threejs_landing_visuals:
    aliases: ["Three.js", "threejs", "WebGL", "GLB", "glTF", "shader", "particles", "3D model", "真实 3D", "产品模型"]
    local_skill: "skills/09-threejs-landing-visuals/SKILL.md"
    upstream_reference: "vendor/official/openai-three-webgl-game/README.md"
    docs_reference: "vendor/official/threejs-docs/README.md"
    notes: "Use only for real WebGL/model/shader/camera visuals. Do not use for CSS 3D or video-only effects."
  gsap_threejs_composer:
    aliases: ["GSAP + Three.js", "ScrollTrigger camera", "WebGL scroll", "滚动驱动 3D"]
    local_skill: "skills/10-gsap-threejs-composer/SKILL.md"
    upstream_reference: ["vendor/official/greensock-gsap-skills/README.md", "vendor/official/openai-three-webgl-game/README.md"]
    notes: "Use when ScrollTrigger/timeline controls Three.js camera, mesh, material, or shader uniforms."
