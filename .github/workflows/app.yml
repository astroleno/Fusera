name: Fusera App

on:
  pull_request:
    paths:
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.node.config.ts"
      - "vitest.react.config.ts"
      - "src/**"
      - "supabase/**"
      - "superpowers/runner/fixtures/lead-icp/**"
      - "tests/**"
      - ".github/workflows/app.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.node.config.ts"
      - "vitest.react.config.ts"
      - "src/**"
      - "supabase/**"
      - "superpowers/runner/fixtures/lead-icp/**"
      - "tests/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  app:
    name: app test build e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test

      - name: Build app
        run: npm run build

      - name: Run browser smoke
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusera-app-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
